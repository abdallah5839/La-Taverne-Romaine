<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>La Taverne Romaine — Concept visuel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --cream:#F4EFE6;
    --cream-2:#EDE5D6;
    --ink:#1A1714;
    --ink-2:#2C2620;
    --terracotta:#B4502B;
    --terracotta-2:#8E3A1E;
    --olive:#3D4A2A;
    --brass:#A88746;
    --brass-2:#C9A86B;
  }
  html,body{background:#2C2620;}
  body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Cormorant Garamond',serif;font-feature-settings:"liga","dlig";}
  .font-display-it{font-family:'Cormorant Garamond',serif;font-style:italic;}
  .tracking-micro{letter-spacing:0.22em;}
  .tracking-mini{letter-spacing:0.14em;}
  .hairline{height:1px;background:linear-gradient(90deg,transparent,rgba(168,135,70,.55),transparent);}
  .hairline-v{width:1px;background:linear-gradient(180deg,transparent,rgba(168,135,70,.45),transparent);}
  .brass-text{color:#A88746;}
  .grain{position:relative;}
  .grain::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay;opacity:.4;}
  .vignette{box-shadow:inset 0 0 180px rgba(0,0,0,.55);}
  .shadow-soft{box-shadow:0 30px 60px -20px rgba(26,23,20,.35),0 12px 24px -10px rgba(26,23,20,.2);}
  .shadow-card{box-shadow:0 20px 40px -16px rgba(26,23,20,.25);}
  .photo-warm{filter:saturate(1.05) contrast(1.04);}
  .num-circle{width:30px;height:30px;border:1px solid rgba(168,135,70,.6);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;}
  .menu-dots{flex:1;border-bottom:1px dotted rgba(26,23,20,.25);margin:0 .75rem;transform:translateY(-6px);}
  .price-tab{font-variant-numeric:tabular-nums;}
  ::selection{background:#B4502B;color:#F4EFE6;}
  /* Scrollbar discreet on stage */
  .stage::-webkit-scrollbar{width:10px;}
  .stage::-webkit-scrollbar-thumb{background:#3a322a;border-radius:10px;}
  .stage::-webkit-scrollbar-track{background:#221d18;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
